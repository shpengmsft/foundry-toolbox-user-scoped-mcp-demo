[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundry-toolbox-user-scoped-mcp-demo"
version = "0.1.0"
description = "Demo MCP server that returns a user-specific tools/list manifest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
user-scoped-mcp = "user_scoped_mcp.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/user_scoped_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
